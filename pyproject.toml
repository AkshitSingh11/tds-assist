[project]
name = "tds-assist"
version = "0.1.0"
description = "TDS section suggester for Indian accounts payable: LLM classifies the nature of payment, code computes the tax."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tds_assist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
